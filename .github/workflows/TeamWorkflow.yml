name: Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration-delivery:
    runs-on: ubuntu-22.04
    container:
      image: node
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build